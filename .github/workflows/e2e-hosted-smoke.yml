name: E2E Hosted Smoke

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Hosted SDLC server URL (optional; falls back to secret HOSTED_SDLC_SERVER_URL)"
        required: false
        type: string
      task:
        description: "Smoke task prompt"
        required: false
        default: "Create a file named smoke_ok.txt containing exactly: smoke-ok"
        type: string
  schedule:
    - cron: "30 4 * * *"
  workflow_run:
    workflows: ["CD GitOps"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_URL_FROM_SECRET: ${{ secrets.HOSTED_SDLC_SERVER_URL }}
      SDLC_API_TOKEN: ${{ secrets.HOSTED_SDLC_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e ".[dev,server,redis]"

      - name: Resolve server URL
        id: resolve
        env:
          INPUT_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          if [ -n "$INPUT_SERVER_URL" ]; then
            echo "server_url=$INPUT_SERVER_URL" >> "$GITHUB_OUTPUT"
          elif [ -n "$SERVER_URL_FROM_SECRET" ]; then
            echo "server_url=$SERVER_URL_FROM_SECRET" >> "$GITHUB_OUTPUT"
          else
            echo "Missing hosted server URL. Set workflow input 'server_url' or secret HOSTED_SDLC_SERVER_URL."
            exit 1
          fi

      - name: Run hosted smoke
        env:
          TASK_INPUT: ${{ github.event.inputs.task }}
        run: |
          TASK_TEXT=${TASK_INPUT:-"Create a file named smoke_ok.txt containing exactly: smoke-ok"}
          sdlc-smoke --server-url "${{ steps.resolve.outputs.server_url }}" --timeout 240 --task "$TASK_TEXT" --skip-tests --skip-docs --skip-git
