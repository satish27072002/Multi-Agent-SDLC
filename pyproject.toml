[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-sdlc"
version = "0.1.0"
description = "Multi-agent CLI tool that automates the software development lifecycle using 6 specialized AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Satish Somarouthu" },
]
keywords = [
    "ai", "agents", "multi-agent", "sdlc", "code-generation",
    "llm", "groq", "pydantic-ai", "a2a", "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-ai[groq]>=0.1.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
tui = [
    "textual>=0.50.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=0.36.0",
]
redis = [
    "redis>=5.0",
]
mcp = [
    "fasta2a>=0.1.0",
]
all = [
    "multi-agent-sdlc[tui,server,redis,mcp]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.3.0",
]

[project.scripts]
sdlc-agent = "src.cli.main:main"
sdlc-smoke = "src.cli.smoke:main"

[project.urls]
Homepage = "https://github.com/satish27072002/multi-agent-sdlc"
Repository = "https://github.com/satish27072002/multi-agent-sdlc"
Issues = "https://github.com/satish27072002/multi-agent-sdlc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Fast, isolated tests",
    "integration: Component interaction tests without external cloud dependency",
    "e2e: End-to-end tests against deployed environments",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
