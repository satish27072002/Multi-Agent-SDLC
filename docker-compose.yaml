# Docker Compose for local multi-agent mode
# Runs all agents + API server + Redis for state management

services:
  # ── API Server (entry point for CLI) ──────────────────────────────────
  api:
    build:
      context: .
      target: server
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
    depends_on:
      - redis
    restart: unless-stopped

  # ── Orchestrator Agent ────────────────────────────────────────────────
  orchestrator:
    build:
      context: .
      target: app
    command: uvicorn src.server.agent_health:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONPATH=/app
      - AGENT_NAME=orchestrator
    restart: unless-stopped

  # ── Coding Agent ──────────────────────────────────────────────────────
  coding:
    build:
      context: .
      target: app
    command: uvicorn src.server.agent_health:app --host 0.0.0.0 --port 9001
    ports:
      - "9001:9001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONPATH=/app
      - AGENT_NAME=coding
    restart: unless-stopped

  # ── Testing Agent ─────────────────────────────────────────────────────
  testing:
    build:
      context: .
      target: app
    command: uvicorn src.server.agent_health:app --host 0.0.0.0 --port 9002
    ports:
      - "9002:9002"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONPATH=/app
      - AGENT_NAME=testing
    restart: unless-stopped

  # ── Review Agent ──────────────────────────────────────────────────────
  review:
    build:
      context: .
      target: app
    command: uvicorn src.server.agent_health:app --host 0.0.0.0 --port 9003
    ports:
      - "9003:9003"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONPATH=/app
      - AGENT_NAME=review
    restart: unless-stopped

  # ── Docs Agent ────────────────────────────────────────────────────────
  docs:
    build:
      context: .
      target: app
    command: uvicorn src.server.agent_health:app --host 0.0.0.0 --port 9004
    ports:
      - "9004:9004"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONPATH=/app
      - AGENT_NAME=docs
    restart: unless-stopped

  # ── GitOps Agent ──────────────────────────────────────────────────────
  gitops:
    build:
      context: .
      target: app
    command: uvicorn src.server.agent_health:app --host 0.0.0.0 --port 9005
    ports:
      - "9005:9005"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONPATH=/app
      - AGENT_NAME=gitops
    restart: unless-stopped

  # ── Redis (task state) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
