apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-agent
  namespace: sdlc-agents
  labels:
    app: coding-agent
    agent-type: coding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coding-agent
  template:
    metadata:
      labels:
        app: coding-agent
        agent-type: coding
    spec:
      containers:
        - name: coding
          image: ghcr.io/satish27072002/multi-agent-sdlc:latest
          command: ["python", "-c"]
          args:
            - |
              import uvicorn
              from starlette.applications import Starlette
              from starlette.responses import JSONResponse
              from starlette.routing import Route

              async def health(request):
                  return JSONResponse({"status": "ok", "agent": "coding"})

              async def card(request):
                  return JSONResponse({
                      "name": "coding",
                      "description": "Generates and modifies code",
                      "url": "http://coding-agent:9001",
                  })

              app = Starlette(routes=[
                  Route("/health", health),
                  Route("/.well-known/agent.json", card),
              ])
              uvicorn.run(app, host="0.0.0.0", port=9001)
          ports:
            - containerPort: 9001
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sdlc-secrets
                  key: groq-api-key
            - name: PYTHONPATH
              value: /app/src
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: coding-agent
  namespace: sdlc-agents
spec:
  selector:
    app: coding-agent
  ports:
    - port: 9001
      targetPort: 9001
---
