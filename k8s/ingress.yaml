apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sdlc-api-ingress
  namespace: sdlc-agents
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - sdlc-api.example.com
      secretName: sdlc-api-tls
  rules:
    - host: sdlc-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sdlc-api
                port:
                  number: 8080
